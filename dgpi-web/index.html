<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-body">
    <!-- main div -->
    <div class="container">
        <h1 class="main-title">Dhaka Polytechnic Institute</h1>
        <h3 class="second-title">Student Login Portal</h3>
        <form action="home.html">
            <label for="roll">Roll:</label>
            <input class="box" type="number" placeholder="Enter your roll" required>
            <label for="registration">Registration:</label>
            <input class="box" type="number" placeholder="Enter your registration" required>
            <label for="Session">Session:</label>
            <input class="box" type="number" placeholder="Enter your session" required>
            <label for="semester">Semester:</label>
            <select class="box" name="" id="" required>
                <option value="" isabled selected>Select your semester</option>
                <option value="">1st</option>
                <option value="">2nd</option>
                <option value="">3rd</option>
                <option value="">4th</option>
                <option value="">5th</option>
                <option value="">6th</option>
                <option value="">7th</option>
                <option value="">8th</option>
            </select>
            <label for="semester">Shift:</label>
            <select class="box" name="" id="" required>
                <option value="" isabled selected>Select your shift</option>
                <option value="">Morning Shift</option>
                <option value="">Evening Shift</option>
            </select>
            <div class="terms">
                <input type="checkbox" required>
                <label for="checkbox">I agree with terms and conditions.</label>
            </div>
            <div class="login-btn">
                <button class="btn" type="reset">Reset</button>
                <button class="btn" type="submit">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
